name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    name: R ${{ matrix.r }}
    strategy:
      fail-fast: false
      matrix:
        r: [release]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
          extra-packages: |
            any::rcmdcheck
            any::arrow
            any::dplyr
      # Fail on errors only: the Rust std staticlib always carries abort/exit
      # symbols, which R CMD check reports as a compiled-code WARNING.
      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"error"'

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570" role="img" aria-labelledby="title desc">
  <title id="title">Measured speed versus compression, including native Pcodec</title>
  <desc id="desc">Historical five-run full-read medians for a real ten-million-row GWAS, with the shipped native CompreSSoR Pcodec implementation overlaid as a separately labelled one-million-row five-run measurement. Lower time and higher compression ratio are better.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #263238; }
    .grid { stroke: #cfd8dc; stroke-width: 1; }
    .axis { stroke: #263238; stroke-width: 1.2; }
    .tick { fill: #607d8b; font-size: 12px; }
    .label { font-size: 11px; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
    .axislabel { font-size: 13px; }
    .point { stroke: #fff; stroke-width: 2; }
    .frontier { fill: none; stroke: #6a1b9a; stroke-width: 2.2; stroke-dasharray: 6 5; }
  </style>
  <rect width="900" height="540" fill="#fff"/>
  <g>
    <line class="grid" x1="88" y1="450" x2="860" y2="450"/><line class="grid" x1="88" y1="406" x2="860" y2="406"/><line class="grid" x1="88" y1="362" x2="860" y2="362"/><line class="grid" x1="88" y1="318" x2="860" y2="318"/><line class="grid" x1="88" y1="274" x2="860" y2="274"/><line class="grid" x1="88" y1="231" x2="860" y2="231"/><line class="grid" x1="88" y1="187" x2="860" y2="187"/><line class="grid" x1="88" y1="143" x2="860" y2="143"/><line class="grid" x1="88" y1="99" x2="860" y2="99"/><line class="grid" x1="88" y1="55" x2="860" y2="55"/>
    <line class="grid" x1="88" y1="55" x2="88" y2="450"/><line class="grid" x1="216" y1="55" x2="216" y2="450"/><line class="grid" x1="345" y1="55" x2="345" y2="450"/><line class="grid" x1="473" y1="55" x2="473" y2="450"/><line class="grid" x1="602" y1="55" x2="602" y2="450"/><line class="grid" x1="730" y1="55" x2="730" y2="450"/><line class="grid" x1="858" y1="55" x2="858" y2="450"/>
    <line class="axis" x1="88" y1="450" x2="860" y2="450"/><line class="axis" x1="88" y1="55" x2="88" y2="450"/>
    <g class="tick" text-anchor="end"><text x="78" y="454">1×</text><text x="78" y="410">2×</text><text x="78" y="366">3×</text><text x="78" y="322">4×</text><text x="78" y="278">5×</text><text x="78" y="235">6×</text><text x="78" y="191">7×</text><text x="78" y="147">8×</text><text x="78" y="103">9×</text><text x="78" y="59">10×</text></g>
    <g class="tick" text-anchor="middle"><text x="88" y="470">0.005</text><text x="216" y="470">0.01</text><text x="345" y="470">0.02</text><text x="473" y="470">0.05</text><text x="602" y="470">0.1</text><text x="730" y="470">0.2</text><text x="858" y="470">1.0</text></g>
    <polyline class="frontier" points="118,255 257,148 267,100 418,88"/>
    <circle cx="847" cy="450" r="5" fill="#607d8b" class="point"/><circle cx="299" cy="404" r="5" fill="#1e88e5" class="point"/><circle cx="601" cy="377" r="5" fill="#1e88e5" class="point"/>
    <circle cx="118" cy="255" r="6" fill="#43a047" class="point"/><circle cx="481" cy="156" r="5" fill="#43a047" class="point"/>
    <circle cx="337" cy="381" r="5" fill="#8e24aa" class="point"/><circle cx="353" cy="390" r="5" fill="#8e24aa" class="point"/>
    <circle cx="471" cy="131" r="5" fill="#fb8c00" class="point"/><circle cx="257" cy="148" r="6" fill="#8e24aa" class="point"/><circle cx="267" cy="100" r="6" fill="#8e24aa" class="point"/><circle cx="418" cy="88" r="6" fill="#fb8c00" class="point"/>
    <circle cx="489" cy="285" r="7" fill="#d81b60" class="point"/>
    <g class="label"><text x="128" y="242" fill="#43a047">Legacy f16/u8 binary</text><text x="246" y="165" text-anchor="end" fill="#6a1b9a">q9/SE10 Parquet</text><text x="278" y="91" fill="#6a1b9a">q8/SE8 Parquet</text><text x="430" y="78" fill="#6a1b9a">q8/SE8 framed binary</text><text x="489" y="151">Legacy f16/u8 zstd</text><text x="480" y="125">q9/SE10 framed binary</text><text x="328" y="374">Float32 Parquet</text><text x="359" y="405">Precise Parquet</text><text x="306" y="421">Raw float32 binary</text><text x="610" y="371">Raw float32 + zstd</text><text x="846" y="442" text-anchor="end">Source gzip</text><text x="500" y="278" fill="#d81b60">Native Pcodec 0.4*</text></g>
    <text class="axislabel" x="474" y="510" text-anchor="middle">Full-read median time (seconds; lower is faster, log scale)</text>
    <text class="axislabel" transform="translate(22 254) rotate(-90)" text-anchor="middle">Compression ratio versus source gzip (higher is better)</text>
    <g class="tick"><circle cx="115" cy="535" r="4" fill="#1e88e5"/><text x="125" y="539">raw binary</text><circle cx="235" cy="535" r="4" fill="#43a047"/><text x="245" y="539">legacy format</text><circle cx="365" cy="535" r="4" fill="#fb8c00"/><text x="375" y="539">framed binary</text><circle cx="500" cy="535" r="4" fill="#8e24aa"/><text x="510" y="539">Parquet</text><line class="frontier" x1="620" x2="645" y1="535" y2="535"/><text x="655" y="539">Pareto frontier</text><circle cx="785" cy="535" r="4" fill="#d81b60"/><text x="795" y="539">native Pcodec 0.4*</text></g>
    <text class="tick" x="88" y="563">* Native Pcodec 0.4: 1M-row Mac mini implementation benchmark; historical points are the original 10M-row GWAS sweep.</text>
  </g>
</svg>

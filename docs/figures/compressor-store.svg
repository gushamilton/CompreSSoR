<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc">
  <title id="title">CompreSSoR store layout</title>
  <desc id="desc">A CompreSSoR store contains a manifest and checksum, identity streams, numeric Pcodec streams, and a compressed exception stream.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".18"/></filter>
    <linearGradient id="folder" x1="0" x2="1"><stop stop-color="#17324d"/><stop offset="1" stop-color="#285f86"/></linearGradient>
    <linearGradient id="identity" x1="0" x2="1"><stop stop-color="#087f8c"/><stop offset="1" stop-color="#20a39e"/></linearGradient>
    <linearGradient id="numeric" x1="0" x2="1"><stop stop-color="#d88b24"/><stop offset="1" stop-color="#f3b544"/></linearGradient>
  </defs>
  <rect width="1100" height="390" rx="24" fill="#f6f8fb"/>
  <text x="48" y="44" font-family="Verdana" font-size="22" font-weight="700" fill="#17324d">One store, separate streams, selective reads</text>
  <g filter="url(#shadow)" font-family="Verdana">
    <rect x="48" y="78" width="1004" height="264" rx="18" fill="white" stroke="#d7e1ea" stroke-width="2"/>
    <rect x="78" y="106" width="248" height="60" rx="12" fill="#17324d"/>
    <text x="202" y="133" text-anchor="middle" font-size="17" font-weight="700" fill="white">manifest.json</text>
    <text x="202" y="153" text-anchor="middle" font-size="12" fill="#dbe9f3">format · identity · QC · tolerances</text>
    <rect x="78" y="182" width="248" height="60" rx="12" fill="#edf3f8" stroke="#b9c9d7"/>
    <text x="202" y="209" text-anchor="middle" font-size="17" font-weight="700" fill="#17324d">manifest.sha256</text>
    <text x="202" y="229" text-anchor="middle" font-size="12" fill="#506273">detached integrity record</text>
    <rect x="78" y="258" width="248" height="60" rx="12" fill="#edf3f8" stroke="#b9c9d7"/>
    <text x="202" y="285" text-anchor="middle" font-size="17" font-weight="700" fill="#17324d">exceptions.zst</text>
    <text x="202" y="305" text-anchor="middle" font-size="12" fill="#506273">sparse higher-precision values</text>
    <rect x="362" y="106" width="300" height="136" rx="12" fill="#087f8c"/>
    <text x="512" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="white">LOSSLESS IDENTITY</text>
    <text x="512" y="163" text-anchor="middle" font-size="14" fill="#e2fbfa">position.pco + index</text>
    <text x="512" y="187" text-anchor="middle" font-size="14" fill="#e2fbfa">substitution.pco + index</text>
    <text x="512" y="215" text-anchor="middle" font-size="12" fill="#e2fbfa">GRCh38 position + complete REF→ALT code</text>
    <rect x="698" y="106" width="324" height="136" rx="12" fill="#d88b24"/>
    <text x="860" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="#3d2a0e">CORE NUMERICS</text>
    <text x="860" y="163" text-anchor="middle" font-size="14" fill="#503710">z.pco + index · Z9</text>
    <text x="860" y="187" text-anchor="middle" font-size="14" fill="#503710">eaf.pco + index · EAF8</text>
    <text x="860" y="211" text-anchor="middle" font-size="14" fill="#503710">se.pco + index · SE6</text>
    <rect x="362" y="258" width="660" height="60" rx="12" fill="#fff7e8" stroke="#e9b75d"/>
    <text x="692" y="285" text-anchor="middle" font-size="16" font-weight="700" fill="#6c4813">Optional typed extras: future Pcodec streams; exact Parquet sidecar today</text>
    <text x="692" y="305" text-anchor="middle" font-size="12" fill="#80612d">kept off the standard MR path so ordinary stores stay compact</text>
  </g>
</svg>

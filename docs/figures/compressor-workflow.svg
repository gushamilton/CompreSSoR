<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
  <title id="title">CompreSSoR workflow</title>
  <desc id="desc">External preparation produces canonical summary statistics; CompreSSoR imports and checks them, compresses them into a self-contained Pcodec store, and serves them to R or fastMR.</desc>
  <defs>
    <linearGradient id="blue" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#17324d"/><stop offset="1" stop-color="#285f86"/></linearGradient>
    <linearGradient id="teal" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#087f8c"/><stop offset="1" stop-color="#20a39e"/></linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#d88b24"/><stop offset="1" stop-color="#f3b544"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".18"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6b7c8d"/></marker>
  </defs>
  <rect width="1100" height="300" rx="24" fill="#f6f8fb"/>
  <text x="52" y="42" font-family="Verdana" font-size="22" font-weight="700" fill="#17324d">From heterogeneous sumstats to analysis-ready access</text>
  <g filter="url(#shadow)" font-family="Verdana" text-anchor="middle">
    <rect x="42" y="100" width="190" height="116" rx="16" fill="#17324d"/>
    <text x="137" y="137" font-size="18" font-weight="700" fill="white">SUMSTATS</text>
    <text x="137" y="164" font-size="14" fill="#dbe9f3">TSV · gz · VCF</text>
    <text x="137" y="187" font-size="13" fill="#dbe9f3">beta / SE / EAF / alleles</text>
    <rect x="300" y="100" width="220" height="116" rx="16" fill="#087f8c"/>
    <text x="410" y="137" font-size="18" font-weight="700" fill="white">PREPARED INPUT</text>
    <text x="410" y="164" font-size="14" fill="#e2fbfa">explicit build · REF/ALT</text>
    <text x="410" y="187" font-size="13" fill="#e2fbfa">effect alleles · beta / SE</text>
    <rect x="588" y="84" width="235" height="148" rx="16" fill="#d88b24"/>
    <text x="705" y="121" font-size="18" font-weight="700" fill="#3d2a0e">.CPR STORE</text>
    <text x="705" y="148" font-size="14" fill="#503710">identity key + Pcodec</text>
    <text x="705" y="171" font-size="13" fill="#503710">Z9 · EAF8 · SE6</text>
    <text x="705" y="194" font-size="13" fill="#503710">independent pages + checksums</text>
    <rect x="892" y="100" width="166" height="116" rx="16" fill="#17324d"/>
    <text x="975" y="137" font-size="18" font-weight="700" fill="white">SERVE</text>
    <text x="975" y="164" font-size="14" fill="#dbe9f3">R · fastMR</text>
    <text x="975" y="187" font-size="13" fill="#dbe9f3">whole / region / keys</text>
  </g>
  <g stroke="#6b7c8d" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M235 158 H292"/><path d="M523 158 H580"/><path d="M826 158 H884"/>
  </g>
  <text x="550" y="270" text-anchor="middle" font-family="Verdana" font-size="14" fill="#506273">External harmonisation/liftover precedes this boundary; the completed core store carries its own build-specific SNV identity.</text>
</svg>
